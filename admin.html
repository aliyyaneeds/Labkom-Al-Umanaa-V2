<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - LabKom Al Umanaa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .card-hover { transition: all 0.2s ease; }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.08); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <h1 class="font-extrabold text-xl text-slate-900 tracking-tight">LabKom Al Umanaa</h1>
        <span class="px-3 py-1 bg-blue-50 text-blue-600 border border-blue-200 rounded-full text-xs font-bold">Admin Panel</span>
      </div>
      <a href="index.html" class="text-sm font-semibold text-blue-600 hover:text-blue-700">← Kembali ke Dashboard</a>
    </div>
  </header>

  <!-- Login PIN -->
  <div id="auth-container" class="flex-1 flex items-center justify-center p-6">
    <div class="bg-white border border-slate-200 rounded-3xl p-8 max-w-sm w-full shadow-xl text-center space-y-4">
      <div class="w-14 h-14 bg-blue-50 border border-blue-100 rounded-2xl flex items-center justify-center text-2xl mx-auto">🔐</div>
      <div>
        <h2 class="text-lg font-extrabold text-slate-900">Admin Authentication</h2>
        <p class="text-xs text-slate-500 mt-1">Masukkan Master PIN (1234) untuk masuk.</p>
      </div>
      <input type="password" id="input-pin" onkeypress="if(event.key==='Enter') checkAdminPin()" placeholder="Masukkan PIN" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-center font-bold tracking-widest text-slate-800 text-sm focus:outline-none focus:border-blue-500">
      <button type="button" onclick="checkAdminPin()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-sm transition">Login</button>
      <p id="auth-error" class="text-xs text-red-500 font-semibold hidden">⚠️ PIN Admin Salah!</p>
    </div>
  </div>

  <!-- Admin Main -->
  <main id="admin-main" class="hidden flex-1 max-w-5xl mx-auto px-6 py-10 w-full space-y-8">
    <div class="text-center space-y-1">
      <h2 class="text-2xl font-extrabold text-slate-900">Panel Pengelolaan Labkom</h2>
      <p class="text-xs text-slate-500">Pilih menu di bawah untuk mengelola booking, unit rusak, jadwal & pekan, unit baru, atau alarm.</p>
    </div>

    <!-- 5 Menu Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5">
      <button type="button" onclick="showSection('booking')" class="card-hover bg-white border border-slate-200 hover:border-blue-400 rounded-2xl p-5 flex flex-col items-center text-center space-y-2 shadow-sm">
        <div class="text-3xl">📅</div>
        <h3 class="font-bold text-blue-600 text-sm">Data Booking</h3>
        <p class="text-[11px] text-slate-400">Lihat & bersihkan data perangkat yang sedang dibooking.</p>
      </button>

      <button type="button" onclick="showSection('broken')" class="card-hover bg-white border border-slate-200 hover:border-amber-400 rounded-2xl p-5 flex flex-col items-center text-center space-y-2 shadow-sm">
        <div class="text-3xl">🛠️</div>
        <h3 class="font-bold text-amber-600 text-sm">Broken Devices & Locks</h3>
        <p class="text-[11px] text-slate-400">Tandai perangkat rusak agar terkunci & tidak bisa dibooking.</p>
      </button>

      <button type="button" onclick="showSection('schedule')" class="card-hover bg-white border border-slate-200 hover:border-emerald-400 rounded-2xl p-5 flex flex-col items-center text-center space-y-2 shadow-sm">
        <div class="text-3xl">⏰</div>
        <h3 class="font-bold text-emerald-600 text-sm">Change Time/Schedule</h3>
        <p class="text-[11px] text-slate-400">Atur Pekan ke-berapa & jam sesi KBM-1 sampai KBM-4.</p>
      </button>

      <button type="button" onclick="showSection('tools')" class="card-hover bg-white border border-slate-200 hover:border-purple-400 rounded-2xl p-5 flex flex-col items-center text-center space-y-2 shadow-sm">
        <div class="text-3xl">💻</div>
        <h3 class="font-bold text-purple-600 text-sm">Manage/Add Tools</h3>
        <p class="text-[11px] text-slate-400">Tambah unit baru (DELL, Chromebook, PC) atau hapus unit.</p>
      </button>

      <button type="button" onclick="showSection('controller')" class="card-hover bg-blue-50/40 border border-blue-200 hover:border-indigo-400 rounded-2xl p-5 flex flex-col items-center text-center space-y-2 shadow-sm">
        <div class="text-3xl">🚨</div>
        <h3 class="font-bold text-indigo-600 text-sm">Device Alarm Controller</h3>
        <p class="text-[11px] text-slate-400">Salin link khusus perangkat untuk timer & alarm kunci layar.</p>
      </button>
    </div>

    <!-- Detail Panel -->
    <div id="section-detail" class="hidden bg-white border-2 border-slate-200 rounded-2xl p-6 space-y-4 shadow-md">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="section-title" class="font-bold text-base text-slate-800">Detail</h3>
        <button type="button" onclick="closeSection()" class="text-xs font-bold px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600">Tutup ✕</button>
      </div>
      <div id="section-content" class="text-xs text-slate-700 overflow-x-auto"></div>
    </div>
  </main>

  <script>
    const MASTER_PIN = "1234";

    function checkAdminPin() {
      if (document.getElementById('input-pin').value === MASTER_PIN) {
        document.getElementById('auth-container').classList.add('hidden');
        document.getElementById('admin-main').classList.remove('hidden');
      } else {
        document.getElementById('auth-error').classList.remove('hidden');
      }
    }

    function getDevices(category) {
      const key = `labkom_devices_${category}`;
      let data = null;
      try { data = JSON.parse(localStorage.getItem(key)); } catch(e) {}
      if (!data || typeof data !== 'object' || Object.keys(data).length === 0) {
        data = {};
        if (category === 'GADGET') {
          for (let i = 1; i <= 6; i++) data[`LD-${String(i).padStart(2, '0')}`] = { id: `LD-${String(i).padStart(2, '0')}`, status: 'free', user: '', jampel: '', endTime: null };
          for (let i = 1; i <= 6; i++) data[`CB-${String(i).padStart(2, '0')}`] = { id: `CB-${String(i).padStart(2, '0')}`, status: 'free', user: '', jampel: '', endTime: null };
        } else {
          for (let i = 1; i <= 26; i++) data[`PC-${String(i).padStart(2, '0')}`] = { id: `PC-${String(i).padStart(2, '0')}`, status: 'free', user: '', jampel: '', endTime: null };
        }
        localStorage.setItem(key, JSON.stringify(data));
      }
      return data;
    }

    function getSchedules() {
      let sched = null;
      try { sched = JSON.parse(localStorage.getItem('labkom_schedules')); } catch(e) {}
      if (!sched) {
        sched = {
          'KBM-1': { label: '07:00 - 08:20', minutes: 80 },
          'KBM-2': { label: '08:50 - 10:00', minutes: 70 },
          'KBM-3': { label: '10:00 - 11:20', minutes: 80 },
          'KBM-4': { label: '12:40 - 14:00', minutes: 80 }
        };
        localStorage.setItem('labkom_schedules', JSON.stringify(sched));
      }
      return sched;
    }

    function getCurrentWeek() {
      let w = localStorage.getItem('labkom_active_week');
      if (!w) {
        const now = new Date();
        const startOfYear = new Date(now.getFullYear(), 0, 1);
        const days = Math.floor((now - startOfYear) / (24 * 60 * 60 * 1000));
        w = Math.ceil((days + startOfYear.getDay() + 1) / 7);
      }
      return w;
    }

    function showSection(type) {
      const detail = document.getElementById('section-detail');
      const title = document.getElementById('section-title');
      const content = document.getElementById('section-content');
      detail.classList.remove('hidden');

      const gadgets = getDevices('GADGET');
      const pcs = getDevices('PC');
      const allDevices = { ...gadgets, ...pcs };

      if (type === 'booking') {
        title.innerText = "📅 Data Booking Aktif";
        const active = Object.values(allDevices).filter(d => d.status === 'occupied');
        const rows = active.map(d => `
          <tr class="border-b">
            <td class="py-2.5 font-bold text-indigo-600">${d.id}</td>
            <td class="py-2.5">${d.user}</td>
            <td class="py-2.5">${d.jampel || '-'}</td>
            <td class="py-2.5 text-right"><button type="button" onclick="resetSingleBooking('${d.id}')" class="px-2.5 py-1 bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold rounded">Bersihkan</button></td>
          </tr>
        `).join('');

        content.innerHTML = `
          <div class="flex justify-between items-center mb-3">
            <span class="text-slate-500">Total sedang dipinjam: <strong>${active.length} unit</strong></span>
            ${active.length > 0 ? `<button type="button" onclick="clearAllBookings()" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-lg">🗑️ Bersihkan Semua Booking</button>` : ''}
          </div>
          <table class="w-full text-left">
            <thead><tr class="border-b text-slate-500"><th class="pb-2">Perangkat</th><th class="pb-2">Peminjam</th><th class="pb-2">Sesi</th><th class="pb-2 text-right">Aksi</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="4" class="py-6 text-center text-slate-400">Semua perangkat kosong (tidak ada booking aktif).</td></tr>'}</tbody>
          </table>
        `;
      }
      else if (type === 'broken') {
        title.innerText = "🛠️ Broken Devices & Locks";
        const rows = Object.values(allDevices).map(d => `
          <tr class="border-b">
            <td class="py-2.5 font-bold">${d.id}</td>
            <td class="py-2.5">${d.status === 'maintenance' ? '<span class="px-2 py-0.5 bg-amber-100 text-amber-800 font-bold rounded">RUSAK (TERKUNCI)</span>' : '<span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 font-semibold rounded">NORMAL</span>'}</td>
            <td class="py-2.5 text-right"><button type="button" onclick="toggleBroken('${d.id}')" class="px-3 py-1 ${d.status === 'maintenance' ? 'bg-emerald-600 text-white' : 'bg-amber-500 text-white'} font-bold rounded">${d.status === 'maintenance' ? 'Buka Kunci / Normal' : 'Tandai Rusak'}</button></td>
          </tr>
        `).join('');
        content.innerHTML = `<table class="w-full text-left"><thead><tr class="border-b text-slate-500"><th class="pb-2">Kode</th><th class="pb-2">Status</th><th class="pb-2 text-right">Aksi</th></tr></thead><tbody>${rows}</tbody></table>`;
      }
      else if (type === 'schedule') {
        title.innerText = "⏰ Atur Pekan Aktif & Jadwal KBM";
        const sched = getSchedules();
        const currentWeek = getCurrentWeek();
        const rows = Object.keys(sched).map(k => `
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 items-center p-3 bg-slate-50 border rounded-xl">
            <strong class="text-slate-800">${k}</strong>
            <input type="text" id="sched-label-${k}" value="${sched[k].label}" class="px-3 py-1.5 border rounded-lg bg-white" placeholder="Jam (misal 07:00 - 08:20)">
            <div class="flex items-center gap-2">
              <input type="number" id="sched-min-${k}" value="${sched[k].minutes}" class="w-20 px-3 py-1.5 border rounded-lg bg-white">
              <span class="text-slate-500">menit</span>
            </div>
          </div>
        `).join('');
        content.innerHTML = `
          <div class="p-4 bg-indigo-50 border border-indigo-200 rounded-xl mb-4 flex flex-wrap items-center justify-between gap-3">
            <div>
              <strong class="text-indigo-900 block">🗓️ Pengaturan Pekan Ke-Berapa (Tampil di Dashboard)</strong>
              <span class="text-indigo-700 text-[11px]">Ubah angka pekan di samping sesuai kalender akademik sekolah.</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="font-bold text-indigo-900">Pekan ke-</span>
              <input type="number" id="input-active-week" value="${currentWeek}" min="1" max="53" class="w-20 px-3 py-1.5 border border-indigo-300 rounded-lg bg-white font-bold text-center text-indigo-900">
            </div>
          </div>
          <div class="space-y-3 mb-4">${rows}</div>
          <button type="button" onclick="saveSchedules()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl">Simpan Pekan & Jadwal KBM</button>
        `;
      }
      else if (type === 'tools') {
        title.innerText = "💻 Manage / Add Tools";
        const rows = Object.values(allDevices).map(d => `
          <tr class="border-b">
            <td class="py-2 font-bold">${d.id}</td>
            <td class="py-2 text-slate-500">${d.id.startsWith('PC') ? 'PC Desktop' : d.id.startsWith('CB') ? 'Chromebook' : 'Laptop DELL'}</td>
            <td class="py-2 text-right"><button type="button" onclick="deleteDevice('${d.id}')" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold rounded">Hapus</button></td>
          </tr>
        `).join('');

        content.innerHTML = `
          <div class="flex flex-wrap gap-2 p-3 bg-purple-50 border border-purple-200 rounded-xl mb-4 items-center">
            <select id="new-tool-type" class="px-3 py-2 border rounded-lg bg-white font-semibold">
              <option value="LD">Laptop DELL (LD)</option>
              <option value="CB">Chromebook (CB)</option>
              <option value="PC">PC Desktop (PC)</option>
            </select>
            <input type="number" id="new-tool-num" placeholder="Nomor urut (misal: 7)" min="1" max="99" class="px-3 py-2 border rounded-lg bg-white w-44">
            <button type="button" onclick="addNewDevice()" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-lg">+ Tambah Perangkat</button>
          </div>
          <table class="w-full text-left"><thead><tr class="border-b text-slate-500"><th class="pb-2">Kode</th><th class="pb-2">Kategori</th><th class="pb-2 text-right">Aksi</th></tr></thead><tbody>${rows}</tbody></table>
        `;
      }
      else if (type === 'controller') {
        title.innerText = "🚨 Device Alarm Controller";
        const rows = Object.values(allDevices).map(d => {
          const url = `${window.location.origin}${window.location.pathname.replace('admin.html', 'index.html')}?device=${d.id}`;
          return `
            <tr class="border-b">
              <td class="py-2.5 font-bold text-indigo-600">${d.id}</td>
              <td class="py-2.5 truncate max-w-[220px] text-slate-400 font-mono text-[11px]">${url}</td>
              <td class="py-2.5 text-right"><button type="button" onclick="copyUrl('${url}')" class="px-3 py-1 bg-indigo-50 border border-indigo-200 hover:bg-indigo-100 text-indigo-700 font-bold rounded">📋 Copy Link</button></td>
            </tr>
          `;
        }).join('');
        content.innerHTML = `<p class="mb-3 text-slate-500">Buka link di bawah pada browser perangkat target untuk mengaktifkan kunci layar & alarm otomatis saat sesi KBM berakhir:</p><table class="w-full text-left"><thead><tr class="border-b text-slate-500"><th class="pb-2">Kode</th><th class="pb-2">Link Perangkat</th><th class="pb-2 text-right">Aksi</th></tr></thead><tbody>${rows}</tbody></table>`;
      }

      detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function closeSection() { document.getElementById('section-detail').classList.add('hidden'); }

    function resetSingleBooking(id) {
      const cat = id.startsWith('PC') ? 'PC' : 'GADGET';
      const data = getDevices(cat);
      if (data[id]) {
        data[id] = { ...data[id], status: 'free', user: '', jampel: '', endTime: null };
        localStorage.setItem(`labkom_devices_${cat}`, JSON.stringify(data));
        showSection('booking');
      }
    }

    function clearAllBookings() {
      ['GADGET', 'PC'].forEach(cat => {
        const data = getDevices(cat);
        Object.keys(data).forEach(id => {
          if (data[id].status === 'occupied') {
            data[id] = { ...data[id], status: 'free', user: '', jampel: '', endTime: null };
          }
        });
        localStorage.setItem(`labkom_devices_${cat}`, JSON.stringify(data));
      });
      showSection('booking');
    }

    function toggleBroken(id) {
      const cat = id.startsWith('PC') ? 'PC' : 'GADGET';
      const data = getDevices(cat);
      if (data[id]) {
        data[id].status = data[id].status === 'maintenance' ? 'free' : 'maintenance';
        data[id].user = '';
        data[id].jampel = '';
        data[id].endTime = null;
        localStorage.setItem(`labkom_devices_${cat}`, JSON.stringify(data));
        showSection('broken');
      }
    }

    function saveSchedules() {
      const weekVal = parseInt(document.getElementById('input-active-week').value);
      if (weekVal && weekVal > 0) {
        localStorage.setItem('labkom_active_week', weekVal);
      }

      const sched = getSchedules();
      Object.keys(sched).forEach(k => {
        const label = document.getElementById(`sched-label-${k}`).value.trim();
        const mins = parseInt(document.getElementById(`sched-min-${k}`).value);
        if (label) sched[k].label = label;
        if (mins > 0) sched[k].minutes = mins;
      });
      localStorage.setItem('labkom_schedules', JSON.stringify(sched));
      alert('Pekan aktif & Jadwal KBM berhasil diperbarui!');
    }

    function addNewDevice() {
      const prefix = document.getElementById('new-tool-type').value;
      const num = parseInt(document.getElementById('new-tool-num').value);
      if (!num || num < 1) return alert('Masukkan nomor urut perangkat yang valid!');

      const id = `${prefix}-${String(num).padStart(2, '0')}`;
      const cat = prefix === 'PC' ? 'PC' : 'GADGET';
      const data = getDevices(cat);

      if (data[id]) return alert(`Perangkat ${id} sudah terdaftar!`);
      data[id] = { id, status: 'free', user: '', jampel: '', endTime: null };
      localStorage.setItem(`labkom_devices_${cat}`, JSON.stringify(data));
      showSection('tools');
    }

    function deleteDevice(id) {
      if (!confirm(`Hapus perangkat ${id} dari daftar?`)) return;
      const cat = id.startsWith('PC') ? 'PC' : 'GADGET';
      const data = getDevices(cat);
      delete data[id];
      localStorage.setItem(`labkom_devices_${cat}`, JSON.stringify(data));
      showSection('tools');
    }

    function copyUrl(url) {
      navigator.clipboard.writeText(url);
      alert('Link perangkat berhasil disalin!');
    }
  </script>
</body>
</html>
